<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCEA Chuka Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B1F5E;--blue:#2E3192;--red:#D93A2F;--gold:#F2B133;--bg:#FFFCF6;--ink:#1A1A2E;--mu:#5B5E7A;--ln:#E8E2D2;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 'Source Sans 3',Arial,sans-serif;background:var(--bg);color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:70}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;color:var(--navy)}
[hidden]{display:none!important}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--ln);background:#fff;width:100%;color:var(--ink)}
.b{display:inline-block;padding:10px 18px;background:var(--red);color:#fff;border:0;font:700 13px 'Source Sans 3';letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.b.s{background:var(--navy)}.b.o{background:#fff;color:var(--ink);border:1px solid var(--ln)}.b.sm{padding:6px 10px;font-size:11px}
#lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--navy)}
.lc{background:var(--bg);width:100%;max-width:400px;padding:36px 32px;text-align:center}
.lc img{height:90px;margin-bottom:14px}.lc h1{font-size:26px;margin-bottom:4px}.lc p{color:var(--mu);margin-bottom:22px}
.lc label{display:block;text-align:left;font-weight:600;font-size:13px;margin:12px 0 6px}.lc .b{width:100%;margin-top:22px}
.hint{font-size:13px;color:var(--mu);margin-top:16px}.err{color:var(--red);font-size:14px;margin-top:12px}
aside{width:250px;background:var(--navy);color:#CFCFE8;position:fixed;top:env(safe-area-inset-top,0px);bottom:0;left:0;z-index:50;overflow-y:auto;transition:width .2s,transform .2s}
.bn{display:flex;align-items:center;gap:12px;padding:18px 16px;color:#fff;font:700 16px/1.15 'Playfair Display',serif}.bn img{height:42px;background:#fff;padding:3px}.bn small{display:block;font:600 10px 'Source Sans 3';letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
aside a.n{display:flex;align-items:center;gap:14px;padding:12px 24px;color:#CFCFE8;text-decoration:none;font-weight:600;border-left:4px solid transparent}
aside a.n:hover{background:rgba(255,255,255,.07)}aside a.n.on{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--gold)}
aside svg{flex:none}.rs{display:block;margin:18px 24px;font-size:12px;color:#9A9CC8;cursor:pointer;background:none;border:0;text-align:left}
main{margin-left:250px;min-width:0;transition:margin .2s}
body.mini aside{width:72px}body.mini main{margin-left:72px}body.mini .tx,body.mini .bn span,body.mini .rs{display:none}body.mini aside a.n{padding:12px 24px}
.tp{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--ln);height:60px;display:flex;align-items:center;gap:14px;padding:0 24px}
.tp button.bg{background:none;border:1px solid var(--ln);padding:8px 10px;cursor:pointer;color:var(--navy)}.tp .u{margin-left:auto;font-size:14px;color:var(--mu)}
#pg{padding:28px}.top2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.top2 h1{font-size:30px}
.card{background:#fff;border:1px solid var(--ln);box-shadow:0 4px 18px rgba(27,31,94,.06);margin-bottom:24px}
.ch{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ln);cursor:pointer;user-select:none}.ch h3{font-size:18px;flex:1}.ch small{color:var(--mu)}
.chev{transition:transform .2s;color:var(--mu)}.card.cl .cb{display:none}.card.cl .chev{transform:rotate(-90deg)}.card.cl .ch{border-bottom:0}
.tb{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px}.tb input{flex:1;min-width:160px;width:auto}.tb select{width:auto;min-width:160px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#F4F1E8;text-align:left;padding:10px 14px;cursor:pointer;white-space:nowrap;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
td{padding:10px 14px;border-top:1px solid var(--ln);white-space:nowrap}.r{text-align:right}th.r{text-align:right}tfoot td{font-weight:700;background:#FAF8F1}
.bd{display:inline-block;padding:2px 10px;font-size:12px;font-weight:700;background:#ECECF4;color:var(--mu)}.bd.g{background:#DDF3E4;color:#1D6B3A}.bd.y{background:#FDF0CF;color:#8A5A00}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px}.kp div{background:#fff;border:1px solid var(--ln);border-top:4px solid var(--gold);padding:16px 18px;color:var(--mu);font-size:13px}.kp b{display:block;font:700 24px 'Playfair Display',serif;color:var(--navy)}
.bars{display:flex;align-items:flex-end;gap:12px;height:210px;padding:18px 18px 40px}.bars i{flex:1;background:var(--blue);position:relative;min-width:14px}.bars i span{position:absolute;top:100%;left:-6px;right:-6px;margin-top:6px;text-align:center;font:11px 'Source Sans 3';color:var(--mu);font-style:normal}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:24px}.ev{padding:12px 18px;border-top:1px solid var(--ln)}.ev:first-child{border:0}.ev b{display:block}.ev span{color:var(--mu);font-size:13px}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:22px}.fg .f1{grid-column:1/-1}label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}.sw input{width:auto;margin-right:6px}.sw{display:flex;align-items:center;padding-top:8px}
.ac{padding:0 22px 22px;display:flex;gap:10px}.rp{padding:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.rp input{width:auto}
.ov{display:none}.ts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}.ts.on{opacity:1}
.ck-editor__editable{min-height:260px}
@media(max-width:900px){aside{transform:translateX(-100%);width:250px!important}body.open aside{transform:none}body.open .ov{display:block;position:fixed;inset:0;background:rgba(14,16,51,.5);z-index:45}main{margin-left:0!important}body.mini .tx,body.mini .bn span,body.mini .rs{display:inline}
#pg{padding:16px}.g2{grid-template-columns:1fr}.fg{grid-template-columns:1fr;padding:16px}.tp{padding:0 14px}.tp .u{display:none}.tp .b{margin-left:auto}}
</style></head><body>
<div id="lg"><div class="lc"><img id="lgi" alt="PCEA"><h1>Church Admin</h1><p>PCEA Chuka Town Church</p>
<form id="lf"><label for="em">Email</label><input id="em" type="email" value="info@pceachuka.com" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Enter password"><button class="b" type="submit">Sign in</button><div class="err" id="er"></div></form>
<div class="hint">Demo login: info@pceachuka.com / pceademo</div></div></div>
<div id="app" hidden><aside><div class="bn"><img id="bi" alt="PCEA"><span>Chuka Town Church<small>Admin</small></span></div><nav id="nv"></nav><button class="rs" id="rs">Reset demo data</button></aside>
<div class="ov" id="ov"></div>
<main><div class="tp"><button class="bg" id="bg" aria-label="Toggle menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="u">info@pceachuka.com</span><button class="b o sm" id="lo">Log out</button></div><div id="pg"></div></main></div>
